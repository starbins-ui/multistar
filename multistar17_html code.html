<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MultiStar17 Product Sales</title>
<style>
  :root{
    --dark-blue:#072b6b;
    --black:#000;
    --white:#fff;
  }
  html,body{margin:0;padding:0;height:100%;font-family:Arial,Helvetica,sans-serif;}
  /* Login Page */
  #loginPage{
    display:flex;align-items:center;justify-content:center;
    background:var(--dark-blue);height:100vh;
  }
  .login-box{
    background:var(--black);color:var(--white);
    padding:30px;border-radius:10px;width:300px;
    text-align:center;
  }
  .login-box h1{margin-top:0;font-size:24px;}
  .login-box input{
    width:90%;padding:10px;margin:10px 0;
    border:none;border-radius:5px;
    background:#111;color:var(--white);
  }
  .login-box button{
    width:95%;padding:10px;border:none;border-radius:5px;
    background:var(--dark-blue);color:var(--white);
    font-weight:bold;cursor:pointer;
  }
  .login-box a{color:var(--white);text-decoration:none;font-weight:bold;}
  /* Shop Page */
  #shopPage{
    display:none;background:var(--black);color:var(--white);
    min-height:100vh;
  }
  header{
    background:var(--dark-blue);padding:15px;text-align:center;
    font-size:24px;font-weight:bold;
  }
  .products{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:20px;padding:20px;
  }
  .product{
    background:var(--dark-blue);padding:15px;border-radius:10px;
    text-align:center;
  }
  .product img{width:100%;border-radius:10px;}
  .product h3{margin:10px 0 5px;}
  .product p{margin:0 0 10px;}
  .product button{
    background:var(--black);color:var(--white);
    border:1px solid var(--white);padding:8px 12px;
    border-radius:5px;cursor:pointer;
  }
  /* AI Chat Widget */
  #chatToggle{
    position:fixed;bottom:24px;right:24px;z-index:1000;
    background:var(--dark-blue);color:var(--white);
    border:none;border-radius:50%;width:56px;height:56px;
    font-size:26px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.5);
    display:none;
  }
  #chatPanel{
    position:fixed;bottom:90px;right:24px;z-index:1000;
    width:340px;background:var(--black);color:var(--white);
    border:1px solid var(--dark-blue);border-radius:12px;
    display:none;flex-direction:column;overflow:hidden;
    box-shadow:0 8px 24px rgba(0,0,0,.6);
  }
  #chatHeader{
    background:var(--dark-blue);padding:12px 16px;
    font-weight:bold;font-size:15px;display:flex;
    align-items:center;justify-content:space-between;
  }
  #chatHeader span{font-size:12px;opacity:.8;}
  #chatMessages{
    flex:1;height:300px;overflow-y:auto;padding:12px;
    display:flex;flex-direction:column;gap:8px;
  }
  .chat-msg{max-width:85%;padding:8px 12px;border-radius:10px;font-size:13px;line-height:1.4;}
  .chat-msg.user{align-self:flex-end;background:var(--dark-blue);}
  .chat-msg.assistant{align-self:flex-start;background:#1a1a1a;border:1px solid #333;}
  .chat-msg.system{align-self:center;background:transparent;color:#aaa;font-size:11px;font-style:italic;}
  #chatKeyRow{padding:10px 12px;border-top:1px solid #222;display:flex;gap:6px;}
  #chatKeyRow input{
    flex:1;padding:7px 10px;border:1px solid #444;border-radius:6px;
    background:#111;color:var(--white);font-size:12px;
  }
  #chatKeyRow button{
    padding:7px 10px;border:none;border-radius:6px;
    background:var(--dark-blue);color:var(--white);cursor:pointer;font-size:12px;
  }
  #chatInputRow{padding:10px 12px;border-top:1px solid #222;display:none;gap:6px;}
  #chatInputRow input{
    flex:1;padding:8px 10px;border:1px solid #444;border-radius:6px;
    background:#111;color:var(--white);font-size:13px;
  }
  #chatInputRow button{
    padding:8px 12px;border:none;border-radius:6px;
    background:var(--dark-blue);color:var(--white);cursor:pointer;font-size:16px;
  }
  #chatInputRow{display:none;align-items:center;}
</style>
</head>
<body>

<!-- Login Page -->
<section id="loginPage">
  <div class="login-box">
    <h1>Welcome</h1>
    <p>Login to enter <br>
      <a href="#" id="siteLink">www.multistar17.com</a>
    </p>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button id="loginBtn">Login</button>
    <p id="msg" style="color:red;display:none;">Please fill all fields</p>
  </div>
</section>

<!-- Shop Page -->
<section id="shopPage">
  <header>MultiStar17 Big Sale</header>
  <div class="products">
    <div class="product">
      <img src="https://via.placeholder.com/200x150?text=Product+1" alt="">
      <h3>Product 1</h3>
      <p>$19.99</p>
      <button>Add to Cart</button>
    </div>
    <div class="product">
      <img src="https://via.placeholder.com/200x150?text=Product+2" alt="">
      <h3>Product 2</h3>
      <p>$29.99</p>
      <button>Add to Cart</button>
    </div>
    <div class="product">
      <img src="https://via.placeholder.com/200x150?text=Product+3" alt="">
      <h3>Product 3</h3>
      <p>$39.99</p>
      <button>Add to Cart</button>
    </div>
  </div>
</section>

<!-- AI Chat Widget -->
<button id="chatToggle" title="Ask our AI assistant">💬</button>

<div id="chatPanel">
  <div id="chatHeader">
    🤖 AI Product Assistant
    <span>claude-opus-4-5</span>
  </div>
  <div id="chatMessages">
    <div class="chat-msg system">Enter your Anthropic API key below to start chatting.</div>
  </div>
  <div id="chatKeyRow">
    <input type="password" id="apiKeyInput" placeholder="sk-ant-…  (Anthropic API key)">
    <button id="saveKeyBtn">Save</button>
  </div>
  <div id="chatInputRow">
    <input type="text" id="chatInput" placeholder="Ask about our products…">
    <button id="sendBtn">➤</button>
  </div>
</div>

<script>
const loginBtn = document.getElementById('loginBtn');
const loginPage = document.getElementById('loginPage');
const shopPage = document.getElementById('shopPage');
const siteLink = document.getElementById('siteLink');
const msg = document.getElementById('msg');

function openShop(){
  loginPage.style.display = 'none';
  shopPage.style.display = 'block';
}

loginBtn.onclick = function(){
  const user = document.getElementById('username').value.trim();
  const pass = document.getElementById('password').value.trim();
  if(!user || !pass){
    msg.style.display = 'block';
  } else {
    msg.style.display = 'none';
    openShop();
  }
};

siteLink.onclick = function(e){
  e.preventDefault();
  openShop();
};

/* ── AI Chat Widget ── */
const chatToggle   = document.getElementById('chatToggle');
const chatPanel    = document.getElementById('chatPanel');
const chatMessages = document.getElementById('chatMessages');
const chatKeyRow   = document.getElementById('chatKeyRow');
const chatInputRow = document.getElementById('chatInputRow');
const apiKeyInput  = document.getElementById('apiKeyInput');
const saveKeyBtn   = document.getElementById('saveKeyBtn');
const chatInput    = document.getElementById('chatInput');
const sendBtn      = document.getElementById('sendBtn');

const SYSTEM_PROMPT =
  'You are a helpful product assistant for the MultiStar17 online shop. ' +
  'Help customers find products, answer questions about features and pricing, ' +
  'and provide friendly shopping advice. Keep responses concise.';

let conversationHistory = [];

function showChatToggle() {
  chatToggle.style.display = 'flex';
  chatToggle.style.alignItems = 'center';
  chatToggle.style.justifyContent = 'center';
}

function appendMessage(role, text) {
  const div = document.createElement('div');
  div.className = 'chat-msg ' + role;
  div.textContent = text;
  chatMessages.appendChild(div);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

function getApiKey() {
  return sessionStorage.getItem('anthropic_api_key') || '';
}

chatToggle.addEventListener('click', function() {
  const isOpen = chatPanel.style.display === 'flex';
  chatPanel.style.display = isOpen ? 'none' : 'flex';
  if (!isOpen && getApiKey()) {
    chatInput.focus();
  }
});

saveKeyBtn.addEventListener('click', function() {
  const key = apiKeyInput.value.trim();
  if (!key) return;
  sessionStorage.setItem('anthropic_api_key', key);
  apiKeyInput.value = '';
  chatKeyRow.style.display = 'none';
  chatInputRow.style.display = 'flex';
  appendMessage('system', 'API key saved. How can I help you today?');
  chatInput.focus();
});

apiKeyInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') saveKeyBtn.click();
});

async function sendMessage() {
  const text = chatInput.value.trim();
  if (!text) return;
  const apiKey = getApiKey();
  if (!apiKey) return;

  chatInput.value = '';
  sendBtn.disabled = true;
  appendMessage('user', text);
  conversationHistory.push({ role: 'user', content: text });

  const thinking = document.createElement('div');
  thinking.className = 'chat-msg assistant';
  thinking.textContent = '…';
  chatMessages.appendChild(thinking);
  chatMessages.scrollTop = chatMessages.scrollHeight;

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-opus-4-5',
        max_tokens: 1024,
        system: SYSTEM_PROMPT,
        messages: conversationHistory
      })
    });

    const data = await response.json();

    if (!response.ok) {
      const errMsg = (data.error && data.error.message) || response.statusText;
      thinking.textContent = 'Error: ' + errMsg;
      conversationHistory.pop();
    } else {
      const reply = data.content[0].text;
      thinking.textContent = reply;
      conversationHistory.push({ role: 'assistant', content: reply });
    }
  } catch (err) {
    thinking.textContent = 'Network error – please try again.';
    conversationHistory.pop();
  }

  chatMessages.scrollTop = chatMessages.scrollHeight;
  sendBtn.disabled = false;
  chatInput.focus();
}

sendBtn.addEventListener('click', sendMessage);
chatInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') sendMessage();
});

/* Show the chat button once the shop is open */
const _origOpenShop = openShop;
openShop = function() {
  _origOpenShop();
  showChatToggle();
  if (getApiKey()) {
    chatKeyRow.style.display = 'none';
    chatInputRow.style.display = 'flex';
  }
};
</script>

</body>
</html>
